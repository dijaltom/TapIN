name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install JS dependencies ────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Setup Ruby + CocoaPods ─────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          echo "CocoaPods version: $(pod --version)"

      # ── 5. Install Pods ────────────────────────────────────────────────────
      - name: Install iOS Pods
        working-directory: ios
        run: pod install --repo-update

      # ── 6. Build unsigned IPA ──────────────────────────────────────────────
      - name: Build iOS (unsigned, simulator + device)
        run: |
          xcodebuild \
            -workspace ios/TapIN.xcworkspace \
            -scheme TapIN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            -archivePath $RUNNER_TEMP/TapIN.xcarchive \
            archive | xcpretty

      # ── 7. Export .ipa ─────────────────────────────────────────────────────
      - name: Create IPA from archive
        run: |
          mkdir -p $RUNNER_TEMP/ipa_output
          # For unsigned build, manually package the .app
          APP_PATH=$(find $RUNNER_TEMP/TapIN.xcarchive -name "*.app" | head -1)
          mkdir -p $RUNNER_TEMP/ipa_output/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/ipa_output/Payload/
          cd $RUNNER_TEMP/ipa_output
          zip -r TapIN.ipa Payload/
          echo "IPA created at: $RUNNER_TEMP/ipa_output/TapIN.ipa"
          ls -lh $RUNNER_TEMP/ipa_output/

      # ── 8. Upload IPA as artifact ──────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapIN-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/ipa_output/TapIN.ipa
          retention-days: 30

      # ── 9. Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ TapIN Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install Instructions" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`TapIN.ipa\` artifact from this run" >> $GITHUB_STEP_SUMMARY
          echo "2. Open AltStore on your Windows PC" >> $GITHUB_STEP_SUMMARY
          echo "3. Drag the .ipa into AltStore → Install" >> $GITHUB_STEP_SUMMARY
          echo "4. Refresh every 7 days (AltStore does this automatically)" >> $GITHUB_STEP_SUMMARY
